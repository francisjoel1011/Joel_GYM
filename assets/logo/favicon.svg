<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Joel Gym badge mark">
  <title>Joel Gym</title>
  <!-- Reduced circular badge mark. The red filled circle is the gym's own
       brand equity (reception LED sign + turf-wall lettering both use a
       solid red circle standing in for the O in JOEL). Built as its own
       compact mark, not a shrunk wordmark — verified legible at 16/32/180px. -->
  <circle cx="50" cy="50" r="50" fill="#E4231C"/>
  <polygon points="56,27 67,27 67,73 33,73 33,62 56,62" fill="#FFFFFF"/>
</svg>
